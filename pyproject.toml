[project]
name = "kylin-aiops"
version = "0.1.0"
description = "Evidence-driven AIOps MVP for Galaxy Kylin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "cryptography>=43,<46",
  "psutil>=6,<8",
  "numpy>=1.26,<3",
]

[project.scripts]
kylin-aiops-agent = "kylin_aiops_agent.main:run"
kylin-aiops-mcp = "kylin_aiops_diagnosis.mcp_server:main"
kylin-aiops-train = "kylin_aiops_model.train:main"

[tool.setuptools]
packages = ["kylin_aiops_api", "kylin_aiops_diagnosis", "kylin_aiops_model", "kylin_aiops_agent"]
package-dir = {kylin_aiops_api = "services/ops-api/src/kylin_aiops_api", kylin_aiops_diagnosis = "services/diagnosis-worker/src/kylin_aiops_diagnosis", kylin_aiops_model = "services/model-service/src/kylin_aiops_model", kylin_aiops_agent = "agents/ops-agent/src/kylin_aiops_agent"}

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "services/ops-api/src",
  "services/diagnosis-worker/src",
  "services/model-service/src",
  "agents/ops-agent/src",
  "evaluation/datasets",
]
addopts = "-q"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
