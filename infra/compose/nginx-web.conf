server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://ops-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /agent/ {
    proxy_pass http://ops-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
