events {}
http {
  log_format json escape=json '{"time":"$time_iso8601","status":$status,"request_time":$request_time,"upstream_time":"$upstream_response_time","uri":"$uri"}';
  access_log /var/log/nginx/access.log json;
  upstream demo_backend { server app-01:8081; }
  server {
    listen 8080;
    location / { proxy_pass http://demo_backend; proxy_connect_timeout 2s; proxy_read_timeout 5s; }
    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  }
}
